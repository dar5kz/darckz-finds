<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opium Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            background: linear-gradient(45deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #e94560;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '▸';
            color: #ff6b6b;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .link-card:hover::before {
            left: 100%;
        }

        .link-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 40px rgba(233, 69, 96, 0.2);
            border-color: rgba(233, 69, 96, 0.3);
        }

        .link-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .link-url {
            font-size: 0.85rem;
            color: #888;
            word-break: break-all;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
        }

        .add-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(45deg, #e94560, #ff6b6b);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .add-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        .icon {
            font-size: 1.2rem;
        }

        @media (max-width: 600px) {
            .links-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Opium Links</h1>

        <!-- Secțiunea dar5kzfinds -->
        <div class="section">
            <h2 class="section-title">dar5kzfinds</h2>
            <div class="links-grid" id="dar5kzfinds-grid">
                <div class="empty-state">
                    No links yet<br>
                    <button class="add-btn" onclick="addLink('dar5kzfinds')">
                        <span class="icon">+</span> Add your first link
                    </button>
                </div>
            </div>
        </div>

        <!-- Secțiunea Shoes (nouă) -->
        <div class="section">
            <h2 class="section-title">Shoes</h2>
            <div class="links-grid" id="shoes-grid">
                <div class="empty-state">
                    No links yet<br>
                    <button class="add-btn" onclick="addLink('shoes')">
                        <span class="icon">+</span> Add your first link
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addLink(section) {
            const title = prompt('Enter link title:');
            const url = prompt('Enter URL:');
            
            if (title && url) {
                const grid = document.getElementById(section + '-grid');
                
                // Remove empty state if it exists
                if (grid.querySelector('.empty-state')) {
                    grid.innerHTML = '';
                }
                
                const linkCard = document.createElement('a');
                linkCard.className = 'link-card';
                linkCard.href = url;
                linkCard.target = '_blank';
                linkCard.innerHTML = `
                    <div class="link-title">${title}</div>
                    <div class="link-url">${url}</div>
                `;
                
                grid.appendChild(linkCard);
            }
        }
    </script>
</body>
</html>
